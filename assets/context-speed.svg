    <rect x="76"  y="81"  width="46" height="169" fill="#4a7ba7"/>
    <rect x="152" y="80"  width="46" height="170" fill="#4a7ba7"/>
    <rect x="228" y="66"  width="46" height="184" fill="#2d5f8a"/>
    <rect x="304" y="120" width="46" height="130" fill="#c4a484"/>
    <rect x="380" y="127" width="46" height="123" fill="#c4a484"/>
    <rect x="456" y="137" width="46" height="113" fill="#c4a484"/>
  </g>
  <g font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="600">
    <text x="99"  y="74">37.6</text>
    <text x="175" y="73">37.8</text>
    <text x="251" y="59">41.0</text>
    <text x="327" y="113">29.0</text>
    <text x="403" y="120">27.4</text>
