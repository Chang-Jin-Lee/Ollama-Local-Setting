  <line x1="56" y1="250" x2="576" y2="250" stroke="#999" stroke-width="1"/>
  <g font-size="11" fill="#555" text-anchor="middle">
    <text x="99"  y="268">16K</text>
    <text x="175" y="268">20K</text>
    <text x="251" y="268">24K</text>
    <text x="327" y="268">28K</text>
    <text x="403" y="268">32K</text>
    <text x="479" y="268">40K</text>
  </g>

  <!-- 한계선 -->
  <line x1="289" y1="60" x2="289" y2="284" stroke="#2d5f8a" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="285" y="298" font-size="10" fill="#2d5f8a" text-anchor="end">여기까지 VRAM에 다 들어감</text>
  <text x="56" y="318" font-size="10" fill="#aaa">Qwen3.8-27B IQ4_XS · 300토큰 생성 · Flash Attention + q8_0 KV cache</text>
