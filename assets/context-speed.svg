<svg xmlns="http://www.w3.org/2000/svg" width="620" height="330" viewBox="0 0 620 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="620" height="330" fill="#ffffff"/>
  <text x="56" y="34" font-size="14" font-weight="600" fill="#1a1a1a">context 길이별 생성 속도 — RTX 4080 16GB</text>
  <text x="56" y="52" font-size="11" fill="#777">24K를 넘기면 일부가 CPU로 밀려나면서 속도가 떨어진다</text>

  <!-- y축 격자 -->
  <g stroke="#e8e8e8" stroke-width="1">
    <line x1="56" y1="250" x2="576" y2="250"/>
    <line x1="56" y1="205" x2="576" y2="205"/>
    <line x1="56" y1="160" x2="576" y2="160"/>
    <line x1="56" y1="115" x2="576" y2="115"/>
    <line x1="56" y1="70"  x2="576" y2="70"/>
  </g>
  <g font-size="10" fill="#999" text-anchor="end">
    <text x="48" y="254">0</text>
    <text x="48" y="209">10</text>
    <text x="48" y="164">20</text>
    <text x="48" y="119">30</text>
    <text x="48" y="74">40</text>
  </g>
  <text x="18" y="160" font-size="10" fill="#777" transform="rotate(-90 18 160)" text-anchor="middle">tok/s</text>

  <!-- 100% GPU 구간 표시 -->
  <rect x="56" y="60" width="300" height="190" fill="#f4f8fb"/>
  <text x="66" y="76" font-size="10" fill="#5b7c99">100% GPU</text>
  <text x="366" y="76" font-size="10" fill="#b07a57">CPU 일부 사용</text>

  <!-- 막대: 16K 37.6 / 20K 37.8 / 24K 41.0 / 28K 29.0 / 32K 27.4 / 40K 25.2 -->
